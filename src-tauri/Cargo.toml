[package]
name = "branchy"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-drag = "2"
notify = "6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
open = "5"
dirs = "5"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
trash = "5"

# Optimize all dependencies even in dev mode — critical for image decoding speed.
# Without this, JPEG decode + resize is 10-20× slower in debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"      # whole-program LTO (slowest link, smallest binary)
opt-level = "z"  # optimise for size over speed
strip = "symbols"
codegen-units = 1
debug = false
incremental = false
overflow-checks = false
# panic = "abort" removed: caused an Access Violation dialog when a Tauri
# command panicked. Default unwind lets Tauri catch panics and surface them
# as IPC errors instead of terminating the whole process.
